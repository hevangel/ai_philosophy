<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Philosophy</title>
<meta name="description" content="Philosophy essays written in dialogue with AI, a knowledge base, and organized research.">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f4ee;
    --panel: #fffdf8;
    --text: #2b2620;
    --muted: #7a7266;
    --accent: #7a3b2e;
    --accent-soft: #b0563f;
    --line: #e4ddd0;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    line-height: 1.7;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-soft); text-decoration: underline; }

  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0.7rem 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .site-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .site-title:hover { text-decoration: none; color: var(--accent); }
  .topnav { display: flex; gap: 1.1rem; font-family: var(--sans); font-size: 0.92rem; }
  .topnav a { color: var(--muted); }
  .topnav a.active { color: var(--accent); font-weight: 600; }
  .topnav a:hover { color: var(--accent); text-decoration: none; }

  main { max-width: 960px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }

  .hero { margin-bottom: 2.5rem; }
  .hero h1 { font-size: 2.1rem; line-height: 1.25; margin: 0 0 0.4rem; }
  .tagline { color: var(--muted); font-size: 1.08rem; margin: 0; font-style: italic; }

  .section { margin-bottom: 2.8rem; }
  .section-head { display: flex; align-items: baseline; gap: 0.8rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
  .section-head h2 { font-size: 1.35rem; margin: 0; }
  .section-head .count { color: var(--muted); font-family: var(--sans); font-size: 0.85rem; }
  .section-desc { color: var(--muted); margin: 0.5rem 0 1rem; font-size: 0.98rem; }
  .section-back { font-family: var(--sans); font-size: 0.9rem; margin-bottom: 1rem; display: inline-block; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.2rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(60, 45, 30, 0.12); transform: translateY(-2px); }
  .card:hover h3 { color: var(--accent); }
  .card a { color: inherit; display: flex; flex-direction: column; height: 100%; }
  .card a:hover { text-decoration: none; }
  .card img.thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid var(--line);
  }
  .card-body { padding: 0.85rem 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
  .card h3 { margin: 0; font-size: 1.05rem; line-height: 1.35; }
  .card .date { color: var(--muted); font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.03em; text-transform: uppercase; }
  .card .summary { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }

  .empty {
    color: var(--muted);
    font-style: italic;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 1.4rem;
    text-align: center;
  }

  /* Article page */
  .article-head { margin-bottom: 1.8rem; }
  .article-head h1 { font-size: 2rem; line-height: 1.25; margin: 0.5rem 0 0.4rem; }
  .article-head .date { color: var(--muted); font-family: var(--sans); font-size: 0.85rem; }
  img.cover {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 1.2rem;
  }

  .prose { font-size: 1.08rem; }
  .prose h1, .prose h2, .prose h3, .prose h4 { line-height: 1.3; margin: 2rem 0 0.7rem; }
  .prose h2 { font-size: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
  .prose h3 { font-size: 1.2rem; }
  .prose p { margin: 0.9rem 0; }
  .prose blockquote {
    margin: 1.2rem 0;
    padding: 0.2rem 1.2rem;
    border-left: 3px solid var(--accent);
    background: var(--panel);
    color: var(--muted);
    font-style: italic;
  }
  .prose img { max-width: 100%; border-radius: 6px; }
  .prose hr { border: none; border-top: 1px solid var(--line); margin: 2.2rem 0; }
  .prose table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 0.45rem 0.7rem; text-align: left; }

  .status { color: var(--muted); text-align: center; padding: 3rem 0; font-style: italic; }
  .error-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 1.2rem 1.4rem;
  }

  footer {
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.82rem;
  }
  .footer-inner { max-width: 960px; margin: 0 auto; padding: 1.2rem; }

  @media (max-width: 640px) {
    .hero h1 { font-size: 1.6rem; }
    .article-head h1 { font-size: 1.5rem; }
    .prose { font-size: 1.02rem; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="site-title" href="#/">AI Philosophy</a>
    <nav class="topnav" id="topnav"></nav>
  </div>
</header>

<main id="app">
  <div class="status">Loading…</div>
</main>

<footer>
  <div class="footer-inner">
    Written in dialogue with AI · <a href="https://github.com/hevangel/ai_philosophy">source on GitHub</a>
  </div>
</footer>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var topnav = document.getElementById('topnav');
  var contentPromise = null;

  function getContent() {
    if (!contentPromise) {
      contentPromise = fetch('content.json').then(function (r) {
        if (!r.ok) throw new Error('content.json HTTP ' + r.status);
        return r.json();
      });
    }
    return contentPromise;
  }

  function dirOf(path) {
    var i = path.lastIndexOf('/');
    return i === -1 ? '' : path.slice(0, i + 1);
  }

  function resolvePath(src, baseDir) {
    if (/^(https?:|data:|#|[a-z]+:|\/)/i.test(src)) return src;
    return baseDir + src;
  }

  // Render markdown text to sanitized HTML, resolving relative image and
  // link paths against the markdown file's own directory, and removing the
  // first H1 (the document title is rendered from content.json instead).
  function renderMarkdown(text, mdPath) {
    var html = marked.parse(text);
    var baseDir = dirOf(mdPath);
    var tpl = document.createElement('template');
    tpl.innerHTML = DOMPurify.sanitize(html);
    var body = tpl.content;
    var firstH1 = body.querySelector('h1');
    if (firstH1) firstH1.remove();
    body.querySelectorAll('img[src]').forEach(function (img) {
      img.src = resolvePath(img.getAttribute('src'), baseDir);
      img.loading = 'lazy';
    });
    body.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (/\.md($|[?#])/i.test(href) && !/^(https?:|#[a-z]+:)/i.test(href)) {
        a.href = '#/md/' + encodeURIComponent(resolvePath(href, baseDir));
      } else if (!/^(https?:|data:|#|mailto:)/i.test(href)) {
        a.href = resolvePath(href, baseDir);
        a.target = '_blank';
        a.rel = 'noopener';
      }
    });
    return tpl.innerHTML;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? esc(iso) : d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function cardHtml(sectionId, item) {
    var img = item.cover
      ? '<img class="thumb" src="' + esc(item.cover) + '" alt="" onerror="this.remove()">'
      : '';
    return (
      '<article class="card">' +
        '<a href="#/read/' + esc(sectionId) + '/' + esc(item.slug) + '">' +
          img +
          '<div class="card-body">' +
            '<h3>' + esc(item.title) + '</h3>' +
            (item.date ? '<span class="date">' + fmtDate(item.date) + '</span>' : '') +
            (item.summary ? '<p class="summary">' + esc(item.summary) + '</p>' : '') +
          '</div>' +
        '</a>' +
      '</article>'
    );
  }

  function sectionHtml(section, showBack) {
    var cards = section.items.length
      ? '<div class="cards">' + section.items.map(function (it) { return cardHtml(section.id, it); }).join('') + '</div>'
      : '<div class="empty">Nothing published here yet.</div>';
    return (showBack ? '<a class="section-back" href="#/">&#8592; All sections</a>' : '') +
      '<section class="section">' +
        '<div class="section-head"><h2>' + esc(section.name) + '</h2>' +
          '<span class="count">' + section.items.length + (section.items.length === 1 ? ' entry' : ' entries') + '</span>' +
        '</div>' +
        (section.description ? '<p class="section-desc">' + esc(section.description) + '</p>' : '') +
        cards +
      '</section>';
  }

  function setNav(activeId, sections) {
    topnav.innerHTML = sections.map(function (s) {
      return '<a href="#/section/' + esc(s.id) + '"' + (s.id === activeId ? ' class="active"' : '') + '>' + esc(s.name) + '</a>';
    }).join('');
  }

  function setTitle(t) {
    document.title = t ? t + ' — AI Philosophy' : 'AI Philosophy';
  }

  function findItem(content, sectionId, slug) {
    for (var i = 0; i < content.sections.length; i++) {
      var s = content.sections[i];
      if (s.id === sectionId) {
        for (var j = 0; j < s.items.length; j++) {
          if (s.items[j].slug === slug) return { section: s, item: s.items[j] };
        }
      }
    }
    return null;
  }

  function showStatus(msg) {
    app.innerHTML = '<div class="status">' + msg + '</div>';
  }

  function showError(msg) {
    app.innerHTML = '<div class="error-box"><strong>Could not load this page.</strong><br>' + esc(msg) + '</div>';
  }

  function fetchMarkdown(path) {
    return fetch(path).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + path);
      return r.text();
    });
  }

  // ---------- routes ----------

  function routeHome(content) {
    setNav(null, content.sections);
    setTitle('');
    app.innerHTML =
      '<div class="hero"><h1>' + esc(content.site.title) + '</h1>' +
      '<p class="tagline">' + esc(content.site.tagline || '') + '</p></div>' +
      content.sections.map(function (s) { return sectionHtml(s, false); }).join('');
  }

  function routeSection(content, sectionId) {
    var section = content.sections.filter(function (s) { return s.id === sectionId; })[0];
    if (!section) return routeHome(content);
    setNav(sectionId, content.sections);
    setTitle(section.name);
    app.innerHTML = sectionHtml(section, true);
  }

  function renderArticle(section, item) {
    var cover = item.cover
      ? '<img class="cover" src="' + esc(item.cover) + '" alt="" onerror="this.remove()">'
      : '';
    showStatus('Loading…');
    fetchMarkdown(item.path).then(function (text) {
      app.innerHTML =
        '<a class="section-back" href="' + (section ? '#/section/' + esc(section.id) : '#/') + '">&#8592; Back</a>' +
        '<header class="article-head">' + cover +
          '<h1>' + esc(item.title) + '</h1>' +
          (item.date ? '<span class="date">' + fmtDate(item.date) + '</span>' : '') +
        '</header>' +
        '<div class="prose">' + renderMarkdown(text, item.path) + '</div>';
      window.scrollTo(0, 0);
    }).catch(showError);
  }

  function routeRead(content, sectionId, slug) {
    var found = findItem(content, sectionId, slug);
    if (!found) return showError('No entry “' + esc(slug) + '” was found in content.json.');
    setNav(found.section.id, content.sections);
    setTitle(found.item.title);
    renderArticle(found.section, found.item);
  }

  function routeMd(content, encodedPath) {
    var path = decodeURIComponent(encodedPath);
    setNav(null, content.sections);
    // If the path matches a registered entry, give it the full article chrome.
    for (var i = 0; i < content.sections.length; i++) {
      var s = content.sections[i];
      for (var j = 0; j < s.items.length; j++) {
        if (s.items[j].path === path) return renderArticle(s, s.items[j]);
      }
    }
    setTitle('');
    showStatus('Loading…');
    fetchMarkdown(path).then(function (text) {
      app.innerHTML =
        '<a class="section-back" href="#/">&#8592; All sections</a>' +
        '<div class="prose">' + renderMarkdown(text, path) + '</div>';
      window.scrollTo(0, 0);
    }).catch(showError);
  }

  // ---------- router ----------

  function route() {
    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/').map(decodeURIComponent);
    getContent().then(function (content) {
      if (parts[0] === '' || hash === '') return routeHome(content);
      if (parts[0] === 'section' && parts[1]) return routeSection(content, parts[1]);
      if (parts[0] === 'read' && parts[1] && parts[2]) return routeRead(content, parts[1], parts[2]);
      if (parts[0] === 'md' && parts.slice(1).join('/')) return routeMd(content, parts.slice(1).join('/'));
      routeHome(content);
    }).catch(function (e) {
      showError('Failed to load content.json — ' + e.message +
        '. If you opened this file directly from disk, serve the folder over HTTP instead (see AGENTS.md).');
    });
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
