<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Philosophy</title>
<meta name="description" content="Philosophy essays written in dialogue with AI, a knowledge base, and organized research.">
<script>
/* Apply saved theme/language before first paint to avoid a flash. */
(function () {
  try {
    var t = localStorage.getItem('aiphil-theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
    var l = localStorage.getItem('aiphil-lang') === 'zh' ? 'zh' : 'en';
    document.documentElement.dataset.lang = l;
    document.documentElement.lang = l === 'zh' ? 'zh-HK' : 'en';
  } catch (e) {}
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f4ee;
    --panel: #fffdf8;
    --text: #2b2620;
    --muted: #7a7266;
    --accent: #7a3b2e;
    --accent-soft: #b0563f;
    --line: #e4ddd0;
    --shadow: rgba(60, 45, 30, 0.12);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17130f;
    --panel: #201a15;
    --text: #ece3d3;
    --muted: #a3967f;
    --accent: #d98d68;
    --accent-soft: #e6a988;
    --line: #383026;
    --shadow: rgba(0, 0, 0, 0.45);
  }
  /* Hong Kong Traditional Chinese font stacks */
  html[lang="zh-HK"] {
    --serif: "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", PMingLiU, MingLiU, serif;
    --sans: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    line-height: 1.7;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-soft); text-decoration: underline; }

  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0.7rem 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .site-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .site-title:hover { text-decoration: none; color: var(--accent); }
  .topnav { display: flex; gap: 1.1rem; font-family: var(--sans); font-size: 0.92rem; }
  .topnav a { color: var(--muted); }
  .topnav a.active { color: var(--accent); font-weight: 600; }
  .topnav a:hover { color: var(--accent); text-decoration: none; }

  .controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--sans);
  }
  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--bg);
  }
  .lang-switch button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    padding: 0.22rem 0.65rem;
    cursor: pointer;
  }
  .lang-switch button.active { background: var(--accent); color: #fff; }
  .lang-switch button:not(.active):hover { color: var(--accent); }
  .icon-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    border-radius: 999px;
    width: 1.95rem;
    height: 1.95rem;
    padding: 0;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

  main { max-width: 960px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }

  .hero { margin-bottom: 2.5rem; }
  .hero h1 { font-size: 2.1rem; line-height: 1.25; margin: 0 0 0.4rem; }
  .tagline { color: var(--muted); font-size: 1.08rem; margin: 0; font-style: italic; }
  html[lang="zh-HK"] .tagline { font-style: normal; }

  .section { margin-bottom: 2.8rem; }
  .section-head { display: flex; align-items: baseline; gap: 0.8rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
  .section-head h2 { font-size: 1.35rem; margin: 0; }
  .section-head .count { color: var(--muted); font-family: var(--sans); font-size: 0.85rem; }
  .section-desc { color: var(--muted); margin: 0.5rem 0 1rem; font-size: 0.98rem; }
  .section-back { font-family: var(--sans); font-size: 0.9rem; margin-bottom: 1rem; display: inline-block; }
  .section-more { font-family: var(--sans); font-size: 0.9rem; display: inline-block; margin-top: 0.9rem; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.2rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); transform: translateY(-2px); }
  .card:hover h3 { color: var(--accent); }
  .card a { color: inherit; display: flex; flex-direction: column; height: 100%; }
  .card a:hover { text-decoration: none; }
  .card img.thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid var(--line);
  }
  .card-body { padding: 0.85rem 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
  .card h3 { margin: 0; font-size: 1.05rem; line-height: 1.35; }
  .card .date { color: var(--muted); font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.03em; text-transform: uppercase; }
  html[lang="zh-HK"] .card .date { text-transform: none; letter-spacing: 0.05em; }
  .card .summary { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }

  .empty {
    color: var(--muted);
    font-style: italic;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 1.4rem;
    text-align: center;
  }
  html[lang="zh-HK"] .empty { font-style: normal; }

  /* Article page */
  .article-head { margin-bottom: 1.8rem; }
  .article-head h1 { font-size: 2rem; line-height: 1.25; margin: 0.5rem 0 0.4rem; }
  .article-head .date { color: var(--muted); font-family: var(--sans); font-size: 0.85rem; }
  img.cover {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 1.2rem;
  }
  .cover-wrap { position: relative; display: block; }
  .cover-wrap .cover { display: block; }
  /* Chinese text overlay shown over an English cover when no chinese_cover.png exists */
  .cover-zh-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 0.1rem;
    padding: 1.4rem 1.2rem 1.1rem;
    text-align: center;
    border-radius: 8px;
    pointer-events: none;
    background: linear-gradient(to top, rgba(15, 10, 6, 0.78) 0%, rgba(15, 10, 6, 0.34) 42%, rgba(15, 10, 6, 0) 72%);
  }
  .cover-zh-overlay .zl-title {
    color: #fff;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.45rem;
    line-height: 1.4;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
  }
  .cover-zh-overlay .zl-line {
    color: #f3ead9;
    font-family: var(--serif);
    font-size: 0.98rem;
    line-height: 1.55;
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
  }
  .cover-zh-overlay.compact { padding: 0.6rem; }
  .cover-zh-overlay.compact .zl-title { font-size: 0.98rem; line-height: 1.4; }
  .cover-zh-overlay.compact .zl-line { display: none; }

  .prose { font-size: 1.08rem; }
  html[lang="zh-HK"] .prose { font-size: 1.05rem; line-height: 2; }
  .prose h1, .prose h2, .prose h3, .prose h4 { line-height: 1.3; margin: 2rem 0 0.7rem; }
  .prose h2 { font-size: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
  .prose h3 { font-size: 1.2rem; }
  .prose p { margin: 0.9rem 0; }
  .prose blockquote {
    margin: 1.2rem 0;
    padding: 0.2rem 1.2rem;
    border-left: 3px solid var(--accent);
    background: var(--panel);
    color: var(--muted);
    font-style: italic;
  }
  html[lang="zh-HK"] .prose blockquote { font-style: normal; }
  .prose img { max-width: 100%; border-radius: 6px; }
  .prose hr { border: none; border-top: 1px solid var(--line); margin: 2.2rem 0; }
  .prose table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 0.45rem 0.7rem; text-align: left; }

  .status { color: var(--muted); text-align: center; padding: 3rem 0; font-style: italic; }
  html[lang="zh-HK"] .status { font-style: normal; }
  .error-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 1.2rem 1.4rem;
  }

  footer {
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.82rem;
  }
  .footer-inner { max-width: 960px; margin: 0 auto; padding: 1.2rem; }

  @media (max-width: 640px) {
    .hero h1 { font-size: 1.6rem; }
    .article-head h1 { font-size: 1.5rem; }
    .prose { font-size: 1.02rem; }
    .cover-zh-overlay .zl-title { font-size: 1.15rem; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="site-title" id="site-title" href="#/">AI Philosophy</a>
    <nav class="topnav" id="topnav"></nav>
    <div class="controls">
      <span class="lang-switch" role="group" aria-label="Language / 語言">
        <button id="lang-en" type="button">EN</button><button id="lang-zh" type="button" lang="zh-HK">中</button>
      </span>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle dark / light theme"></button>
    </div>
  </div>
</header>

<main id="app">
  <div class="status">Loading…</div>
</main>

<footer>
  <div class="footer-inner" id="footer-inner"></div>
</footer>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var topnav = document.getElementById('topnav');
  var siteTitleEl = document.getElementById('site-title');
  var footerEl = document.getElementById('footer-inner');
  var themeBtn = document.getElementById('theme-btn');
  var langEnBtn = document.getElementById('lang-en');
  var langZhBtn = document.getElementById('lang-zh');
  var contentPromise = null;
  var currentContent = null;

  var lang = document.documentElement.dataset.lang === 'zh' ? 'zh' : 'en';

  // Clean URLs: the app lives at /ai_philosophy/ on both live hosts (GitHub
  // Pages project site and the horace.org mirror); '/' when served locally
  // from a server rooted at the repo. Routes are pushed as real paths and
  // Apache (or 404.html on GitHub Pages) falls back to index.html for them.
  var APP_BASE = location.pathname.indexOf('/ai_philosophy/') === 0 ? '/ai_philosophy/' : '/';
  function appUrl(p) { return APP_BASE + p; }
  function isExternalPath(p) { return /^(https?:|data:|#|[a-z]+:|\/)/i.test(p); }
  function toAppUrl(p) { return isExternalPath(p) ? p : appUrl(p); }

  var I18N = {
    en: {
      loading: 'Loading…',
      back: '\u2190 Back',
      all: '\u2190 All sections',
      empty: 'Nothing published here yet.',
      one: 'entry',
      many: 'entries',
      more: 'View all {n} \u2192',
      errTitle: 'Could not load this page.',
      notFound: 'No entry \u201C{x}\u201D was found in content.json.',
      loadFail: 'Failed to load content.json \u2014 {m}. If you opened this file directly from disk, serve the folder over HTTP instead (see AGENTS.md).',
      footerPre: 'Written in dialogue with AI \u00B7 ',
      footerLink: 'source on GitHub'
    },
    zh: {
      loading: '載入中……',
      back: '\u2190 返回',
      all: '\u2190 所有欄目',
      empty: '此欄目暫時未有內容。',
      one: '篇',
      many: '篇',
      more: '查看全部 {n} 篇 \u2192',
      errTitle: '無法載入此頁面。',
      notFound: 'content.json 中找不到條目「{x}」。',
      loadFail: '無法載入 content.json——{m}。若你是直接從磁碟開啟此檔案，請改以 HTTP 伺服器瀏覽（見 AGENTS.md）。',
      footerPre: '與人工智能對話而寫成 \u00B7 ',
      footerLink: '於 GitHub 觀看原始碼'
    }
  };

  function t(key) { return I18N[lang][key]; }

  function getContent() {
    if (!contentPromise) {
      contentPromise = fetch(appUrl('content.json')).then(function (r) {
        if (!r.ok) throw new Error('content.json HTTP ' + r.status);
        return r.json();
      });
    }
    return contentPromise;
  }

  // Pick the field for the active language, falling back to the English value.
  function L(obj, field) {
    if (lang === 'zh') {
      var zh = obj[field + '_zh'];
      if (zh) return zh;
    }
    return obj[field];
  }

  function dirOf(path) {
    var i = path.lastIndexOf('/');
    return i === -1 ? '' : path.slice(0, i + 1);
  }

  // articles/foo/index.md -> articles/foo/chinese_index.md (same for cover.png)
  function zhVariant(path) {
    var i = path.lastIndexOf('/');
    return i === -1 ? 'chinese_' + path : path.slice(0, i + 1) + 'chinese_' + path.slice(i + 1);
  }

  function resolvePath(src, baseDir) {
    if (/^(https?:|data:|#|[a-z]+:|\/)/i.test(src)) return src;
    return baseDir + src;
  }

  // Render markdown text to sanitized HTML, resolving relative image and
  // link paths against the markdown file's own directory, and removing the
  // first H1 (the document title is rendered from content.json instead).
  function renderMarkdown(text, mdPath) {
    var html = marked.parse(text);
    var baseDir = dirOf(mdPath);
    var tpl = document.createElement('template');
    tpl.innerHTML = DOMPurify.sanitize(html);
    var body = tpl.content;
    var firstH1 = body.querySelector('h1');
    if (firstH1) firstH1.remove();
    body.querySelectorAll('img[src]').forEach(function (img) {
      img.src = toAppUrl(resolvePath(img.getAttribute('src'), baseDir));
      img.loading = 'lazy';
    });
    body.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (/\.md($|[?#])/i.test(href) && !/^(https?:|#[a-z]+:)/i.test(href)) {
        a.href = appUrl('md/' + encodeURIComponent(resolvePath(href, baseDir)));
      } else if (!isExternalPath(href)) {
        a.href = toAppUrl(resolvePath(href, baseDir));
        a.target = '_blank';
        a.rel = 'noopener';
      }
    });
    return tpl.innerHTML;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return esc(iso);
    return d.toLocaleDateString(lang === 'zh' ? 'zh-HK' : 'en-US',
      { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // ---------- cover resolution (language aware) ----------

  var existsCache = {};
  function exists(url) {
    if (!(url in existsCache)) {
      // The Apache SPA fallback answers missing files with 200 text/html
      // (index.html); only a non-HTML response counts as "exists".
      existsCache[url] = fetch(toAppUrl(url), { method: 'HEAD' }).then(function (r) {
        return r.ok && !/text\/html/i.test(r.headers.get('content-type') || '');
      }).catch(function () { return false; });
    }
    return existsCache[url];
  }

  function imgTag(cls, src) {
    return '<img class="' + cls + '" src="' + esc(toAppUrl(src)) + '" alt="" onerror="this.remove()">';
  }

  function zhOverlayHtml(lines, compact) {
    var inner = '<span class="zl-title">' + esc(lines[0]) + '</span>';
    for (var i = 1; i < lines.length; i++) {
      inner += '<span class="zl-line">' + esc(lines[i]) + '</span>';
    }
    return '<span class="cover-zh-overlay' + (compact ? ' compact' : '') + '">' + inner + '</span>';
  }

  // Returns a Promise<html>. In Chinese mode, prefer chinese_cover.png; if it is
  // missing, fall back to the English cover with the translated words overlaid.
  function coverHtml(item, compact) {
    if (!item.cover) return Promise.resolve('');
    var cls = compact ? 'thumb' : 'cover';
    if (lang !== 'zh') return Promise.resolve(imgTag(cls, item.cover));
    var zhCover = zhVariant(item.cover);
    return Promise.all([exists(zhCover), exists(item.cover)]).then(function (r) {
      var zhOk = r[0], enOk = r[1];
      if (zhOk) return imgTag(cls, zhCover);
      if (!enOk) return '';
      var lines = (item.cover_zh_text && item.cover_zh_text.length)
        ? item.cover_zh_text
        : (item.title_zh ? [item.title_zh] : null);
      if (!lines) return imgTag(cls, item.cover);
      return '<span class="cover-wrap">' + imgTag(cls, item.cover) + zhOverlayHtml(lines, compact) + '</span>';
    });
  }

  // ---------- rendering ----------

  function cardHtml(sectionId, item) {
    return coverHtml(item, true).then(function (img) {
      return (
        '<article class="card">' +
          '<a href="' + appUrl('read/' + esc(sectionId) + '/' + esc(item.slug)) + '">' +
            img +
            '<div class="card-body">' +
              '<h3>' + esc(L(item, 'title')) + '</h3>' +
              (item.date ? '<span class="date">' + fmtDate(item.date) + '</span>' : '') +
              (item.summary ? '<p class="summary">' + esc(L(item, 'summary')) + '</p>' : '') +
            '</div>' +
          '</a>' +
        '</article>'
      );
    });
  }

  function sectionHtml(section, showBack, limit) {
    var total = section.items.length;
    var shown = (limit && total > limit) ? section.items.slice(0, limit) : section.items;
    var cardsP = shown.length
      ? Promise.all(shown.map(function (it) { return cardHtml(section.id, it); }))
          .then(function (cards) { return '<div class="cards">' + cards.join('') + '</div>'; })
      : Promise.resolve('<div class="empty">' + esc(t('empty')) + '</div>');
    return cardsP.then(function (cards) {
      var n = total;
      var count = n + (n === 1 ? ' ' + t('one') : ' ' + t('many'));
      var more = (shown.length !== total)
        ? '<a class="section-more" href="' + appUrl('section/' + esc(section.id)) + '">' +
            esc(t('more')).replace('{n}', n) + '</a>'
        : '';
      return (showBack ? '<a class="section-back" href="' + appUrl('') + '">' + esc(t('all')) + '</a>' : '') +
        '<section class="section">' +
          '<div class="section-head"><h2>' + esc(L(section, 'name')) + '</h2>' +
            '<span class="count">' + esc(count) + '</span>' +
          '</div>' +
          (section.description ? '<p class="section-desc">' + esc(L(section, 'description')) + '</p>' : '') +
          cards + more +
        '</section>';
    });
  }

  function setNav(activeId, sections) {
    topnav.innerHTML = sections.map(function (s) {
      return '<a href="' + appUrl('section/' + esc(s.id)) + '"' + (s.id === activeId ? ' class="active"' : '') + '>' + esc(L(s, 'name')) + '</a>';
    }).join('');
  }

  function siteTitle() {
    if (!currentContent) return 'AI Philosophy';
    return L(currentContent.site, 'title') || 'AI Philosophy';
  }

  function setTitle(t2) {
    document.title = t2 ? t2 + ' — ' + siteTitle() : siteTitle();
    trackPageView();
  }

  function trackPageView() {
    if (typeof window.gtag !== 'function') return;
    window.gtag('event', 'page_view', {
      page_title: document.title,
      page_location: location.href,
      page_path: location.pathname + location.search + location.hash
    });
  }

  function applyChrome() {
    document.documentElement.lang = lang === 'zh' ? 'zh-HK' : 'en';
    langEnBtn.classList.toggle('active', lang === 'en');
    langZhBtn.classList.toggle('active', lang === 'zh');
    if (currentContent) siteTitleEl.textContent = siteTitle();
    footerEl.innerHTML = esc(t('footerPre')) +
      '<a href="https://github.com/hevangel/ai_philosophy">' + esc(t('footerLink')) + '</a>';
  }

  function applyThemeButton() {
    var dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.textContent = dark ? '☀️' : '🌙';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }

  function findItem(content, sectionId, slug) {
    for (var i = 0; i < content.sections.length; i++) {
      var s = content.sections[i];
      if (s.id === sectionId) {
        for (var j = 0; j < s.items.length; j++) {
          if (s.items[j].slug === slug) return { section: s, item: s.items[j] };
        }
      }
    }
    return null;
  }

  function showStatus(msg) {
    app.innerHTML = '<div class="status">' + msg + '</div>';
  }

  function showError(msg) {
    app.innerHTML = '<div class="error-box"><strong>' + esc(t('errTitle')) + '</strong><br>' + esc(msg) + '</div>';
  }

  function fetchMarkdown(path) {
    return fetch(toAppUrl(path)).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + path);
      // A 200 text/html response is the Apache SPA fallback serving index.html
      // for a file that does not exist — treat it as missing so callers fall
      // back (e.g. zh text falls back to the English document).
      if (/text\/html/i.test(r.headers.get('content-type') || '')) {
        throw new Error('missing ' + path);
      }
      return r.text();
    });
  }

  // ---------- routes ----------

  // Cap how many cards each section shows on the home page; section pages stay complete.
  var HOME_LIMITS = { articles: 6, 'college-essays': 3 };

  function routeHome(content) {
    setNav(null, content.sections);
    setTitle('');
    showStatus(t('loading'));
    Promise.all(content.sections.map(function (s) { return sectionHtml(s, false, HOME_LIMITS[s.id]); }))
      .then(function (htmls) {
        app.innerHTML =
          '<div class="hero"><h1>' + esc(L(content.site, 'title')) + '</h1>' +
          '<p class="tagline">' + esc(L(content.site, 'tagline') || '') + '</p></div>' +
          htmls.join('');
      });
  }

  function routeSection(content, sectionId) {
    var section = content.sections.filter(function (s) { return s.id === sectionId; })[0];
    if (!section) return routeHome(content);
    setNav(sectionId, content.sections);
    setTitle(L(section, 'name'));
    showStatus(t('loading'));
    sectionHtml(section, true).then(function (html) { app.innerHTML = html; });
  }

  function renderArticle(section, item) {
    var mdPath = lang === 'zh' ? zhVariant(item.path) : item.path;
    var md = fetchMarkdown(mdPath).catch(function (e) {
      // No Chinese translation (or fetch failed) — fall back to the English text.
      if (lang === 'zh' && mdPath !== item.path) return fetchMarkdown(item.path);
      throw e;
    });
    Promise.all([md, coverHtml(item, false)]).then(function (r) {
      var text = r[0], cover = r[1];
      app.innerHTML =
        '<a class="section-back" href="' + appUrl(section ? 'section/' + esc(section.id) : '') + '">' + esc(t('back')) + '</a>' +
        '<header class="article-head">' + cover +
          '<h1>' + esc(L(item, 'title')) + '</h1>' +
          (item.date ? '<span class="date">' + fmtDate(item.date) + '</span>' : '') +
        '</header>' +
        '<div class="prose">' + renderMarkdown(text, mdPath) + '</div>';
      window.scrollTo(0, 0);
    }).catch(showError);
  }

  function routeRead(content, sectionId, slug) {
    var found = findItem(content, sectionId, slug);
    if (!found) return showError(t('notFound').replace('{x}', slug));
    setNav(found.section.id, content.sections);
    setTitle(L(found.item, 'title'));
    renderArticle(found.section, found.item);
  }

  function routeMd(content, encodedPath) {
    var path = decodeURIComponent(encodedPath);
    setNav(null, content.sections);
    // If the path matches a registered entry (English or Chinese variant),
    // give it the full article chrome.
    for (var i = 0; i < content.sections.length; i++) {
      var s = content.sections[i];
      for (var j = 0; j < s.items.length; j++) {
        var it = s.items[j];
        if (it.path === path || zhVariant(it.path) === path) {
          setTitle(L(it, 'title'));
          return renderArticle(s, it);
        }
      }
    }
    setTitle('');
    showStatus(t('loading'));
    fetchMarkdown(path).then(function (text) {
      app.innerHTML =
        '<a class="section-back" href="' + appUrl('') + '">' + esc(t('all')) + '</a>' +
        '<div class="prose">' + renderMarkdown(text, path) + '</div>';
      window.scrollTo(0, 0);
    }).catch(showError);
  }

  // ---------- router ----------

  // Route parts from the clean path (e.g. /ai_philosophy/read/<s>/<slug> →
  // ['read', s, slug]); legacy '#/…' URLs are rewritten to clean paths in place.
  function currentRouteParts() {
    if (location.hash.indexOf('#/') === 0) {
      history.replaceState(null, '', appUrl(location.hash.slice(2)));
    }
    var p = location.pathname;
    if (APP_BASE !== '/' && p.indexOf(APP_BASE) === 0) p = p.slice(APP_BASE.length);
    else p = p.replace(/^\/+/, '');
    p = p.replace(/\/+$/, '');
    return p === '' ? [''] : p.split('/').map(decodeURIComponent);
  }

  function route() {
    var parts = currentRouteParts();
    getContent().then(function (content) {
      currentContent = content;
      applyChrome();
      if (parts[0] === '') return routeHome(content);
      if (parts[0] === 'section' && parts[1]) return routeSection(content, parts[1]);
      if (parts[0] === 'read' && parts[1] && parts[2]) return routeRead(content, parts[1], parts[2]);
      if (parts[0] === 'md' && parts.slice(1).join('/')) return routeMd(content, parts.slice(1).join('/'));
      routeHome(content);
    }).catch(function (e) {
      showError(t('loadFail').replace('{m}', e.message));
    });
  }

  // ---------- toggles ----------

  langEnBtn.addEventListener('click', function () { setLang('en'); });
  langZhBtn.addEventListener('click', function () { setLang('zh'); });

  function setLang(l) {
    if (lang === l) return;
    lang = l;
    try { localStorage.setItem('aiphil-lang', l); } catch (e) {}
    route();
  }

  themeBtn.addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = dark;
    try { localStorage.setItem('aiphil-theme', dark); } catch (e) {}
    applyThemeButton();
  });

  applyThemeButton();
  // In-app navigation: intercept links targeting this app (a clean path under
  // APP_BASE, or a legacy '#/…' href) and route them via pushState instead of
  // a full page load. External / modified / target=_blank links pass through.
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 ||
        e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.target || a.hasAttribute('download')) return;
    var href = a.getAttribute('href');
    if (!href) return;
    var dest = null;
    if (href.indexOf(APP_BASE) === 0) dest = href.slice(APP_BASE.length);
    else if (href.charAt(0) === '#') dest = href.replace(/^#\/?/, '');
    if (dest === null) return;
    e.preventDefault();
    if (appUrl(dest) === location.pathname + location.search) { route(); return; }
    history.pushState(null, '', appUrl(dest));
    route();
  });
  window.addEventListener('popstate', route);
  route();
})();
</script>
</body>
</html>
