<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Philosophy</title>
<script>
/* GitHub Pages has no SPA rewrite fallback: it serves this file (with status
   404) for any path without a real file. Convert the clean app URL into the
   hash-route form; the SPA then upgrades it back to a clean path in place. */
(function () {
  var base = '/ai_philosophy/';
  var p = location.pathname;
  var route = p.indexOf(base) === 0 ? p.slice(base.length) : '';
  if (route === '' || route === 'index.html') location.replace(base);
  else location.replace(base + '#/' + route);
})();
</script>
</head>
<body><p>Redirecting…</p></body>
</html>
